    <rect x="8.9" y="10.8" width="3.1" height="2.4" rx="1.2" fill="#40c6dd"/>
    <path d="M11.7 8.9L15.1 12L11.7 15.1Z" fill="#40c6dd"/>
  </g>
</svg>
